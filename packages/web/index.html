<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <!-- The phone's browser chrome wears the app's own ground (--bg). -->
    <meta name="theme-color" content="#050507" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <!-- The app's mark (shared MARK_GLYPH) in the accent on a square of the ground, at whole
         scales: the svg wherever a browser takes one, the .ico (32px, 1x) where it does not,
         the home-screen icon at 7x (180px). The .ico names its size so the svg wins. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The link preview (description, canonical URL, Open Graph + Twitter card): written by
         the build, one per page that has its own (src/linkPreviews.ts, vite.config.ts). -->
    <!-- link-preview -->
    <title>Whippin AI</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
