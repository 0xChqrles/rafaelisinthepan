name: Deploy

# CD: deploy on push to main and on manual dispatch. Only the stack(s) whose code
# actually changed are redeployed (path-filtered); a manual run can force a selection.
#
# Scope: this workflow deploys the APP stacks — WhippinBackendStack, WhippinWebStack and,
# since #236, WhippinBotStack (the WhatsApp bot: a Fargate service, a table, a queue and a
# scheduled Lambda; it needs Docker on the runner, which ubuntu-latest has). The third CDK stack, WhippinDeployStack (the GitHub OIDC provider +
# this workflow's own deploy role), is intentionally NOT deployed here: the deploy role
# can't edit IAM, so CI cannot provision its own privileges. Deploy that stack by hand
# with account credentials (see packages/infra/README.md). Do not add a job for it.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stacks:
        description: Which stack(s) to deploy
        type: choice
        default: changed
        options: [changed, web, backend, bot, all]

# Never overlap deploys to main — queue rather than cancel an in-flight deploy.
concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  id-token: write # OIDC token for AWS role assumption (no long-lived keys)
  contents: read

jobs:
  # Decide which stacks to deploy: the changed-path mapping for pushes / a manual
  # "changed" run, or the forced selection from workflow_dispatch (web|backend|bot|all).
  plan:
    name: Plan stacks
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.decide.outputs.backend }}
      web: ${{ steps.decide.outputs.web }}
      bot: ${{ steps.decide.outputs.bot }}
    steps:
      # Depth 2, not the default 1: a manual dispatch diffs against the commit before HEAD,
      # which a single-commit checkout does not have.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # `HEAD~1` IS NOT A REFSPEC. paths-filter FETCHES its base by name
      # (`git fetch origin <base> main`), and git refuses a revision expression there —
      # `fatal: invalid refspec 'HEAD~1'`, which failed every workflow_dispatch run,
      # forced selection included, because the filter runs before the input is read.
      # Depth alone could not fix it: the ref existed locally and the fetch still asked
      # origin for it by that name. Resolved to a SHA, which IS one.
      - name: Resolve the dispatch base
        id: base
        if: github.event_name == 'workflow_dispatch'
        run: echo "sha=$(git rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"

      # shared -> all three (bundled into the Lambdas, built into the SPA, inlined into the
      # bot image); infra -> all three (holds every stack def); root deps / this workflow
      # -> all three (safe default). The bot's own package reaches only its stack.
      # SKIPPED when a dispatch already names its stack: there is nothing for it to decide,
      # and it is the step that fails. `changed` still needs it, on either trigger, which is
      # why the base above exists rather than the whole step being conditional on a push.
      - name: Detect changed paths
        id: filter
        if: github.event_name != 'workflow_dispatch' || inputs.stacks == 'changed'
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.event_name == 'workflow_dispatch' && steps.base.outputs.sha || github.event.before }}
          filters: |
            backend:
              - 'packages/backend/**'
              - 'packages/shared/**'
              - 'packages/infra/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/deploy.yml'
            web:
              - 'packages/web/**'
              - 'packages/shared/**'
              - 'packages/infra/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/deploy.yml'
            bot:
              - 'packages/whatsapp-bot/**'
              - 'packages/shared/**'
              - 'packages/infra/**'
              - '.dockerignore'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/deploy.yml'

      - name: Decide targets
        id: decide
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.stacks || 'changed' }}
          CHANGED_BACKEND: ${{ steps.filter.outputs.backend }}
          CHANGED_WEB: ${{ steps.filter.outputs.web }}
          CHANGED_BOT: ${{ steps.filter.outputs.bot }}
        run: |
          backend=false
          web=false
          bot=false
          case "$MODE" in
            all)     backend=true;  web=true; bot=true ;;
            backend) backend=true ;;
            web)     web=true ;;
            bot)     bot=true ;;
            changed) backend="${CHANGED_BACKEND:-false}"; web="${CHANGED_WEB:-false}"; bot="${CHANGED_BOT:-false}" ;;
          esac
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "bot=$bot" >> "$GITHUB_OUTPUT"
          echo "Deploy plan (mode=$MODE): backend=$backend web=$web bot=$bot"

  deploy-backend:
    name: Deploy WhippinBackendStack
    needs: plan
    if: needs.plan.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # cdk.json's app runs from packages/infra; --filter exec runs there.
      #
      # OPERATOR_EMAIL is the address the SES reputation alarms notify and inbound mail for
      # the domain is forwarded to (#230). It is a repository VARIABLE rather than a literal
      # because it is a personal address and this repo is public. Unset, it arrives as an
      # empty string and the stack builds no mail plumbing at all — which a local synth may
      # want, but PRODUCTION never does: the site publishes a privacy notice saying that
      # inbox works, and a deploy that removed the MX, the alarms and the landing bucket
      # would make that a lie while the sender went unmonitored. So the job FAILS here,
      # before touching AWS, rather than warning and continuing.
      - name: Deploy backend stack
        env:
          OPERATOR_EMAIL: ${{ vars.OPERATOR_EMAIL }}
        run: |
          set -euo pipefail
          if [ -z "$OPERATOR_EMAIL" ]; then
            echo "::error::OPERATOR_EMAIL repository variable is unset. The backend deploy requires it: it builds the SES bounce/complaint alarms and the domain's inbound mail (#230). Set it under Settings > Secrets and variables > Actions > Variables, then re-run."
            exit 1
          fi
          pnpm --filter @whippin/infra exec cdk deploy WhippinBackendStack \
            -c "operatorEmail=$OPERATOR_EMAIL" --require-approval never

      # Deploying the Lambda is NOT enough to change what players receive. Puzzle responses
      # are served with a year-long s-maxage, so every already-cached (date, lang,
      # Accept-Encoding) entry keeps being answered from the edge with the OLD body until it
      # is purged — a deploy that changes the response (new Content-Encoding, new bytes) would
      # otherwise reach nobody who had already loaded that day. `puzzle:publish --s3` purges
      # for exactly this reason after an upload; a code deploy needs the same.
      #
      # `/*` is ONE invalidation path (the free tier allows 1,000/month), and it also covers
      # /og and /s, whose share tokens are cached `immutable` — so a card-render change no
      # longer needs the by-hand invalidation that used to be required.
      #
      # Needs `cloudfront:CreateInvalidation` on the deploy role (deploy-role-stack.ts). That
      # stack is deployed BY HAND by design, so if this step fails with AccessDenied, run
      # `pnpm --filter @whippin/infra deploy:auth` and re-run the job — the Lambda above has
      # already deployed, so the site is up; only the purge is missing.
      - name: Invalidate the API CDN
        run: |
          set -euo pipefail
          DIST=$(aws cloudformation describe-stacks \
            --stack-name WhippinBackendStack \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" \
            --output text)
          if [ -z "$DIST" ] || [ "$DIST" = "None" ]; then
            echo "::error::Could not resolve DistributionId from WhippinBackendStack outputs"
            exit 1
          fi
          echo "Invalidating /* on $DIST"
          aws cloudfront create-invalidation --distribution-id "$DIST" --paths '/*'

  deploy-web:
    name: Deploy WhippinWebStack
    # GATED ON THE BACKEND when both stacks ship together. The SPA validates the shapes it
    # receives (`parseBoard` and friends): a response missing a field the new client
    # requires is rejected as malformed, not tolerated. So a web deploy that lands BEFORE
    # its backend — or one that lands after the backend FAILED — serves a client that
    # refuses every answer the live API gives it. The two jobs used to run concurrently off
    # `plan` alone, which made that ordering a coin toss on every deploy touching both.
    #
    # `always()` is what keeps a WEB-ONLY deploy working: without it, a skipped
    # `deploy-backend` would skip this job too (a skipped dependency skips its dependents).
    # So the gate is "the backend did not fail or get cancelled", which passes for both
    # `success` and `skipped`.
    needs: [plan, deploy-backend]
    if: >-
      always()
      && needs.plan.outputs.web == 'true'
      && needs.deploy-backend.result != 'failure'
      && needs.deploy-backend.result != 'cancelled'
    runs-on: ubuntu-latest
    # VITE_API_BASE_URL is the committed single source of truth in packages/web/.env.production
    # (loaded by `pnpm build`), so it is NOT passed here. Turnstile's PUBLIC production site
    # key is a REQUIRED repo variable: unlike optional analytics, a missing value must stop
    # deployment rather than silently ship score collection disabled (#170).
    env:
      VITE_PLAUSIBLE_DOMAIN: ${{ vars.VITE_PLAUSIBLE_DOMAIN }}
      VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      # Must build BEFORE cdk deploy — WebStack uploads dist/. VITE_API_BASE_URL comes
      # from the committed packages/web/.env.production; the Turnstile site key comes from
      # the required repository variable (vite.config.ts refuses a production build without it).
      - name: Build SPA
        run: pnpm build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy web stack
        run: pnpm --filter @whippin/infra exec cdk deploy WhippinWebStack --require-approval never

  deploy-bot:
    name: Deploy WhippinBotStack
    needs: plan
    if: needs.plan.outputs.bot == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # The bot's stack (#236) is independent of the two app stacks: it builds the task
      # image from the repo root (Docker, present on ubuntu-latest), pushes it through the
      # CDK bootstrap image-publishing role, and rolls the ONE Fargate task stop-before-start.
      # OPERATOR_EMAIL is the same repository variable the backend needs: it is who the bot's
      # "disconnected" and dead-letter alarms reach. Required here for the same reason as
      # there — an alarm nobody is subscribed to is the failure the alarm exists to remove.
      # SSM is the source of truth for group configs (#236); the repository holds only a
      # template. This materializes them into the gitignored snapshot the image, the Lambda
      # bundle and the podium SCHEDULES are all built from, so one deploy runs on one
      # coherent set. It validates as it writes, so an unparseable config fails here rather
      # than shipping. Needs `ssm:GetParametersByPath` on the deploy role (deploy-role-stack).
      - name: Pull group configs from SSM
        run: pnpm bot:groups pull

      - name: Deploy bot stack
        env:
          OPERATOR_EMAIL: ${{ vars.OPERATOR_EMAIL }}
        run: |
          set -euo pipefail
          if [ -z "$OPERATOR_EMAIL" ]; then
            echo "::error::OPERATOR_EMAIL repository variable is unset. The bot deploy requires it: its disconnected/dead-letter alarms notify that address (#236)."
            exit 1
          fi
          pnpm --filter @whippin/infra exec cdk deploy WhippinBotStack \
            -c "operatorEmail=$OPERATOR_EMAIL" --require-approval never
