name: CI

# Test gate: runs on every PR into main or dev, and on pushes to both. Make the
# "Typecheck + test" job a required status check in branch protection so a PR
# with failing tests cannot be merged (see .github/workflows/README.md).
# `dev` joined 2026-08-26: feature PRs now land on the dev integration branch
# first (PR #221/#222), and a PR retargeted there was silently getting NO run —
# pull_request only fires for the bases this list names.
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

# One in-flight run per ref; cancel superseded runs on the same PR/branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from the root packageManager field (pnpm@11.9.0).
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      # uv + Python 3.12 for generation + benchmark pytest (dependency-free:
      # their conftests/path wiring make an ephemeral pytest env enough).
      - name: Set up uv (+ Python)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Typecheck
        run: pnpm -r --if-present run typecheck

      # Fans out to Vitest (shared/web/backend) + pytest (generation/benchmark).
      - name: Test
        run: pnpm test
